
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="description" content="お探しのページが見つかりませんでした。ROSE HIPのホームページへお戻りください。">
  <title>404 | ページが見つかりません | ROSE HIP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">

  <style>
    .error-page {
      min-height: 100vh;
      background: #faf9f7;
      color: #292724;
    }

    .error-header {
      padding: 28px 20px;
      border-bottom: 1px solid #e7e2dc;
      text-align: center;
    }

    .error-brand {
      color: inherit;
      text-decoration: none;
      font-family: "Cormorant Garamond", serif;
      font-size: 30px;
      letter-spacing: 0.16em;
    }

    .error-main {
      min-height: 65vh;
      padding: 100px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .error-number {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(100px, 18vw, 180px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.04em;
    }

    .error-title {
      margin: 36px 0 20px;
      font-family: "Noto Serif JP", serif;
      font-size: clamp(18px, 3vw, 26px);
      font-weight: 400;
      line-height: 1.8;
    }

    .error-description {
      margin: 0;
      font-size: 13px;
      line-height: 2.2;
      color: #77716c;
    }

    .error-link {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 60px;
      margin-top: 60px;
      padding: 18px 0;
      min-width: 220px;
      border-bottom: 1px solid #b7a99d;
      color: inherit;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.12em;
      transition: opacity 0.2s ease;
    }

    .error-link:hover {
      opacity: 0.6;
    }

    .error-link:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 5px;
    }

    .error-footer {
      padding: 30px 20px;
      text-align: center;
      border-top: 1px solid #e7e2dc;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: #77716c;
    }

    @media (max-width: 600px) {
      .error-main {
        min-height: 70vh;
        padding: 80px 20px;
      }

      .error-link {
        margin-top: 44px;
      }
    }
  </style>
</head>

<body class="error-page">
  <header class="error-header">
    <a class="error-brand" href="./index.html" aria-label="ROSE HIP ホーム">
      ROSE HIP
    </a>
  </header>

  <main class="error-main">
    <p class="error-number" aria-hidden="true">404</p>

    <h1 class="error-title">
      ページが見つかりませんでした。
    </h1>

    <p class="error-description">
      お探しのページは、移動または削除された可能性があります。
    </p>

    <a class="error-link" href="./index.html">
      <span>HOMEに戻る</span>
      <span aria-hidden="true">→</span>
    </a>
  </main>

  <footer class="error-footer">
    &copy; ROSE HIP
  </footer>
</body>
</html>
